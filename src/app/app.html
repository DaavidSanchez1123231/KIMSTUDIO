<ng-container *ngIf="router.url === '/login' ||router.url === '/crear-cuenta' ||router.url === '/recuperar' || router.url === '/reservas' || router.url === '/nuestros-servicios' ||router.url === '/promociones-publico' ||router.url === '/nosotros' || router.url === '/contacto'">
  <router-outlet></router-outlet>
</ng-container>

<ng-container *ngIf="router.url === '/'">
  <app-home></app-home>
</ng-container>

<div class="app-container" *ngIf="router.url !== '/login' && router.url !== '/crear-cuenta' && router.url !== '/recuperar' && router.url !== '/' && router.url !== '/reservas'&& router.url !== '/promociones-publico'&& router.url !== '/nuestros-servicios' && router.url !== '/nosotros' && router.url !== '/contacto'">
  
  <app-sidebar></app-sidebar>

  <div class="main-content">
    <app-topbar></app-topbar>
    <router-outlet></router-outlet>
  </div>
  
</div>
